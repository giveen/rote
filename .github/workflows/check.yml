name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --quiet -r requirements.txt
      - name: browsers
        run: ./.venv/bin/playwright install --with-deps chromium
      - name: check
        run: ./check.sh
